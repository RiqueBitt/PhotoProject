name: Capturas de tela

# Abre o app de verdade (AppImage da release) numa tela virtual e tira as
# capturas usadas na página do app na aba Apps do Project Club. As imagens
# vão para o ramo 'capturas'.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release com o AppImage (vazio = a versão vX.Y.Z mais recente)'
        default: ''

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Baixar o AppImage da release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG=$(gh api "repos/${{ github.repository }}/releases?per_page=50" --jq '[.[]|select(.tag_name|test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))][0].tag_name')
          fi
          echo "Release: $TAG"
          mkdir -p app && gh release download "$TAG" -R "${{ github.repository }}" -p '*.AppImage' -D app
          mv app/*.AppImage app/app.AppImage && chmod +x app/app.AppImage
      - name: Dependências para rodar e capturar
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxcb-cursor0 libxkbcommon-x11-0 libegl1 libopengl0 || true
          sudo apt-get install -y -qq xvfb xdotool imagemagick openbox libfuse2 libgl1 libegl1 libopengl0 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libnss3 libgbm1 libasound2 libgtk-3-0 libwebkit2gtk-4.0-37 libsecret-1-0 libnotify4 libxss1 fonts-noto-core fonts-noto-color-emoji mesa-vulkan-drivers || true
      - name: Rodar o app e capturar telas
        run: |
          mkdir -p shots
          rc=0
          bash .github/scripts/screenshots.sh app/app.AppImage shots > shots/run.log 2>&1 || rc=$?
          cat shots/run.log
          exit $rc
      - name: Guardar capturas no ramo 'capturas'
        if: always()
        run: |
          cd shots
          git init -q -b capturas
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Capturas de tela (run ${{ github.run_id }})"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" capturas
