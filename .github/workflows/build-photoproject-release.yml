name: Build PhotoProject release

# Empacota o PhotoProject (editor de imagem, base Patchy) no formato que
# o módulo do Project Club consome — um arquivo único por plataforma,
# mesmo padrão já usado pelo ProjectMC (ver goldapple-launcher/.github/
# workflows/build-projectmc-release.yml).

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão a publicar (ex: 1.0.0) — usada na tag e no nome dos arquivos'
        required: true

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Ninja
        run: choco install ninja -y
      - name: Configurar ambiente MSVC (cl.exe no PATH)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Instalar Qt 6.8.3 (MSVC)
        shell: bash
        run: |
          pip install --break-system-packages -q aqtinstall || pip install -q aqtinstall
          aqt install-qt windows desktop 6.8.3 win64_msvc2022_64 -m qtimageformats qtpdf -O "$GITHUB_WORKSPACE/.deps/Qt"
      - name: Configurar e compilar (preset release)
        shell: cmd
        run: |
          cmake --preset release -DCMAKE_PREFIX_PATH="%GITHUB_WORKSPACE%\.deps\Qt\6.8.3\msvc2022_64" -DCMAKE_CXX_COMPILER=cl -DCMAKE_C_COMPILER=cl
          cmake --build --preset release
      - name: Verificar o executável gerado
        shell: bash
        run: test -f build/release/PhotoProject.exe || { echo "build/release/PhotoProject.exe não foi gerado."; exit 1; }
      - name: Empacotar (windeployqt + zip)
        shell: cmd
        run: |
          set QT_PREFIX=%GITHUB_WORKSPACE%\.deps\Qt\6.8.3\msvc2022_64
          set STAGE=%GITHUB_WORKSPACE%\stage
          mkdir "%STAGE%"
          copy /Y build\release\PhotoProject.exe "%STAGE%\" || exit /b 1
          "%QT_PREFIX%\bin\windeployqt.exe" --release --no-compiler-runtime --no-translations "%STAGE%\PhotoProject.exe"
          if errorlevel 1 exit /b 1
      - name: Compactar
        shell: pwsh
        run: |
          Compress-Archive -Path "$env:GITHUB_WORKSPACE\stage\*" -DestinationPath "$env:GITHUB_WORKSPACE\photoproject-${{ inputs.version }}-win.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: photoproject-win
          path: photoproject-${{ inputs.version }}-win.zip

  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Instalar dependências do sistema
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            libgl-dev libegl-dev libxkbcommon-dev libxkbcommon-x11-0 \
            libfontconfig1 libfreetype6 libdbus-1-3 \
            libxcb1 libx11-xcb1 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-shm0 libxcb-sync1 \
            libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1 libxcb-glx0 libxcb-util1 \
            libsm6 libice6 libxext6 libxrender1 \
            fonts-liberation fonts-dejavu-core \
            ninja-build
      - name: Instalar Qt 6.8.3
        run: |
          pip install --break-system-packages -q aqtinstall
          aqt install-qt linux desktop 6.8.3 linux_gcc_64 -m qtimageformats qtpdf -O "$GITHUB_WORKSPACE/.deps/Qt"
      - name: Configurar e compilar (preset linux-release)
        run: |
          cmake --preset linux-release
          cmake --build --preset linux-release -j "$(nproc)"
      - name: Verificar o executável gerado
        run: |
          test -f build/linux-release/PhotoProject || { echo "build/linux-release/PhotoProject não foi gerado."; exit 1; }
      - name: Empacotar (binário + bibliotecas Qt necessárias)
        run: |
          set -e
          QT_DIR="$GITHUB_WORKSPACE/.deps/Qt/6.8.3/gcc_64"
          STAGE="$GITHUB_WORKSPACE/stage"
          mkdir -p "$STAGE/lib" "$STAGE/plugins/platforms" "$STAGE/plugins/imageformats" "$STAGE/plugins/tls"
          cp build/linux-release/PhotoProject "$STAGE/"
          # Bibliotecas Qt principais que o binário linka diretamente —
          # ldd lista as dependências reais, filtra só as que vêm do
          # próprio diretório do Qt instalado (as do sistema operacional
          # já são esperadas nos pacotes apt instalados acima).
          for lib in $(ldd build/linux-release/PhotoProject | grep "$QT_DIR" | awk '{print $3}'); do
            cp -n "$lib" "$STAGE/lib/" || true
          done
          cp "$QT_DIR"/plugins/platforms/libqxcb.so "$STAGE/plugins/platforms/" 2>/dev/null || true
          cp "$QT_DIR"/plugins/platforms/libqoffscreen.so "$STAGE/plugins/platforms/" 2>/dev/null || true
          for p in qgif qjpeg qsvg qtiff qwebp; do
            cp "$QT_DIR/plugins/imageformats/lib${p}.so" "$STAGE/plugins/imageformats/" 2>/dev/null || true
          done
          cat > "$STAGE/photoproject.sh" << 'LAUNCHER_EOF'
          #!/bin/bash
          DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          export LD_LIBRARY_PATH="$DIR/lib:$LD_LIBRARY_PATH"
          export QT_PLUGIN_PATH="$DIR/plugins"
          exec "$DIR/PhotoProject" "$@"
          LAUNCHER_EOF
          chmod +x "$STAGE/photoproject.sh" "$STAGE/PhotoProject"
          cd "$GITHUB_WORKSPACE"
          tar -C stage -czf "photoproject-${{ inputs.version }}-linux.tar.gz" .
      - name: Empacotar AppImage
        run: |
          set -e
          # Item pedido: "adicione suporte para gerar uma versão
          # .AppImage... permitindo que o usuário execute os
          # aplicativos em distribuições Linux sem precisar instalar
          # dependências manualmente" — reaproveita a MESMA pasta
          # "stage" já montada acima (binário + libs Qt + plugins já
          # copiados e testados no .tar.gz) em vez de montar tudo de
          # novo do zero — só reorganiza pra estrutura padrão que um
          # AppImage exige (AppDir/usr/bin, AppDir/usr/lib, um
          # .desktop, um ícone e um AppRun).
          APPDIR="$GITHUB_WORKSPACE/AppDir"
          mkdir -p "$APPDIR/usr/bin" "$APPDIR/usr/lib" "$APPDIR/usr/plugins"
          cp stage/PhotoProject "$APPDIR/usr/bin/"
          cp stage/lib/*.so* "$APPDIR/usr/lib/" 2>/dev/null || true
          cp -r stage/plugins/* "$APPDIR/usr/plugins/" 2>/dev/null || true
          cp packaging/linux/icons/hicolor/256x256/apps/com.rtsoft.patchy.png "$APPDIR/photoproject.png"
          cat > "$APPDIR/photoproject.desktop" << 'DESKTOP_EOF'
          [Desktop Entry]
          Type=Application
          Name=PhotoProject
          Exec=PhotoProject
          Icon=photoproject
          Categories=Graphics;
          DESKTOP_EOF
          cat > "$APPDIR/AppRun" << 'APPRUN_EOF'
          #!/bin/bash
          DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          export LD_LIBRARY_PATH="$DIR/usr/lib:$LD_LIBRARY_PATH"
          export QT_PLUGIN_PATH="$DIR/usr/plugins"
          exec "$DIR/usr/bin/PhotoProject" "$@"
          APPRUN_EOF
          chmod +x "$APPDIR/AppRun" "$APPDIR/usr/bin/PhotoProject"
          wget -q "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage" -O appimagetool
          chmod +x appimagetool
          # appimagetool tenta abrir uma janela FUSE por padrão — sem
          # ambiente gráfico no runner, precisa do modo --appimage-extract-and-run.
          ./appimagetool --appimage-extract-and-run "$APPDIR" "photoproject-${{ inputs.version }}-linux.AppImage"
          chmod +x "photoproject-${{ inputs.version }}-linux.AppImage"
      - uses: actions/upload-artifact@v4
        with:
          name: photoproject-linux
          path: photoproject-${{ inputs.version }}-linux.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: photoproject-linux-appimage
          path: photoproject-${{ inputs.version }}-linux.AppImage

  publish:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist }
      - name: Publicar release em PhotoProject_releases
        env:
          GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
        run: |
          gh release create "v${{ inputs.version }}" \
            dist/photoproject-win/photoproject-${{ inputs.version }}-win.zip \
            dist/photoproject-linux/photoproject-${{ inputs.version }}-linux.tar.gz \
            dist/photoproject-linux-appimage/photoproject-${{ inputs.version }}-linux.AppImage \
            --repo RiqueBitt/PhotoProject_releases- \
            --title "PhotoProject v${{ inputs.version }}" \
            --notes "Build automática do PhotoProject — editor de imagem opcional do Project Club."
